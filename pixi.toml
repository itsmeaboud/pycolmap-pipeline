[workspace]
authors = ["aboud <>"]
channels = ["conda-forge"]
name = "colmap_project"
platforms = [{ platform = "linux-64", cuda = "12" }]
version = "0.1.0"



[dependencies]
python = "3.12.*"
numpy = ">=2.5.1,<3"
pip = ">=26.2,<27"
#pycolmap = ">=4.1.1,<5"

[pypi-dependencies]
rerun-sdk = ">=0.35.0, <0.36"
jaxtyping = ">=0.3.11, <0.4"
pycolmap-cuda12 = ">=4.1.1,<5"



[tasks]

sparse = "python3 main.py sparse"
mvs = "python main.py mvs"
load = "python main.py load"

viewer = "rerun"


