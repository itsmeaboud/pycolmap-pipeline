[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colmap_pipeline"
version = "0.1.0"
description = "A Python pipeline for COLMAP sparse and dense reconstruction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1,<3",
    "pycolmap-cuda12>=4.1.1,<5",
    "rerun-sdk>=0.34.0,<0.36",
    "jaxtyping>=0.3.11,<0.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]